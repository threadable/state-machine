name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            laravel: "^11.0"
            testbench: "^9.0"
          - php: "8.3"
            laravel: "^12.0"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "^12.0"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "^13.0"
            testbench: "^11.0"

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-lock

      - name: Align dependency set for Laravel ${{ matrix.laravel }}
        run: |
          composer require --dev --no-interaction --no-update \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:^11.0"
          composer require --no-interaction --no-update \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/events:${{ matrix.laravel }}" \
            "illuminate/filesystem:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/validation:${{ matrix.laravel }}"

      - name: Cache Composer files
        uses: actions/cache@v5
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
            vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run CI checks
        run: composer ci
